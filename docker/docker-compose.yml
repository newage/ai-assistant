name: ai-assistant

x-logging: &logging
  driver: json-file
  options:
    max-size: "1m"
    max-file: "2"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-demo}
      MYSQL_READONLY_USER: ${MYSQL_READONLY_USER:-readonly}
      MYSQL_READONLY_PASSWORD: ${MYSQL_READONLY_PASSWORD:?set MYSQL_READONLY_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # TCP ping: the temporary init server only listens on a socket, so this passes only when MySQL is really ready
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  vector-db:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai-service:
    build:
      context: ../ai-service
      dockerfile: ../docker/Dockerfile
    restart: unless-stopped
    logging: *logging
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-haiku-5-5}
      CLAUDE_EFFORT: ${CLAUDE_EFFORT-low}
      CLAUDE_MAX_TOKENS: ${CLAUDE_MAX_TOKENS:-1024}
      MAX_MESSAGES: ${MAX_MESSAGES:-4}
      MAX_MESSAGE_CHARS: ${MAX_MESSAGE_CHARS:-500}
      FAQ_MIN_SCORE: ${FAQ_MIN_SCORE:-0.80}
      QDRANT_URL: http://vector-db:6333
      LOG_ID: ${LOG_ID:-dev}
      ENVIRONMENT: ${ENVIRONMENT:-local}
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    depends_on:
      vector-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql-data:
  qdrant-data:
